<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found – Ibtasam Ahmad</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 20px; }
    .notfound-card { padding: 40px 30px; max-width: 460px; cursor: default; }
    .notfound-code { font-size: 64px; font-weight: 600; line-height: 1; margin-bottom: 10px;
      background: var(--text-gradient-yellow); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .notfound p { color: var(--light-gray); font-size: var(--fs-6); font-weight: 300; line-height: 1.6; margin: 10px 0 25px; }
    .notfound .btn-primary { margin: auto; }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="content-card notfound-card">
      <p class="notfound-code">404</p>
      <h1 class="h2" style="color: var(--white-2)">Page not found</h1>
      <p>This page doesn't exist. Head back to the portfolio of Ibtasam Ahmad, AI/ML Engineer.</p>
      <a class="btn-primary" href="/">Back to portfolio</a>
    </div>
  </main>
</body>
</html>
